<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0816">
    <meta name="description" content="Download Storytime AI — bedtime audiobook adventures for families.">
    <meta property="og:title" content="Get Storytime AI">
    <meta property="og:description" content="Create magical bedtime audiobook adventures together.">
    <meta property="og:type" content="website">
    <title>Get Storytime AI</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0B0816;
            color: #F8FAFC;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(139, 92, 246, 0.30), transparent 34rem),
                linear-gradient(180deg, #0B0816 0%, #120A22 48%, #1E1233 100%);
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            content: "";
            pointer-events: none;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(251, 191, 36, .72) 0 2px, transparent 3px),
                radial-gradient(circle at 84% 16%, rgba(251, 191, 36, .58) 0 2px, transparent 3px),
                radial-gradient(circle at 91% 45%, rgba(251, 191, 36, .48) 0 1px, transparent 2px),
                radial-gradient(circle at 16% 68%, rgba(251, 191, 36, .48) 0 2px, transparent 3px),
                radial-gradient(circle at 72% 82%, rgba(251, 191, 36, .44) 0 2px, transparent 3px);
        }

        main {
            width: min(100% - 32px, 720px);
            min-height: calc(100vh - 92px);
            margin: 0 auto;
            padding: 30px 0 42px;
            display: grid;
            place-items: center;
        }

        .card {
            width: 100%;
            padding: clamp(28px, 6vw, 52px);
            text-align: center;
            background: rgba(24, 20, 44, .74);
            border: 1px solid rgba(248, 250, 252, .10);
            border-radius: 36px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #F8FAFC;
            font-size: clamp(1.25rem, 4vw, 1.6rem);
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            object-position: 76% 52%;
        }

        .mascot-wrap {
            width: min(76vw, 310px);
            aspect-ratio: 1;
            margin: 18px auto 22px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 64px;
            background: rgba(255, 255, 255, .07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05), 0 16px 40px rgba(0, 0, 0, .28);
        }

        .mascot-wrap img {
            width: 135%;
            max-width: none;
            transform: scale(1.38);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 3.35rem);
            line-height: 1.06;
            letter-spacing: -.045em;
        }

        .tagline {
            max-width: 540px;
            margin: 18px auto 28px;
            color: rgba(248, 250, 252, .78);
            font-size: clamp(1rem, 3.8vw, 1.22rem);
            line-height: 1.55;
        }

        .store-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .store-link {
            display: inline-flex;
            min-height: 64px;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: transform .18s ease, filter .18s ease;
        }

        .store-link:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .store-link:focus-visible { outline: 3px solid #38BDF8; outline-offset: 5px; }
        .store-link img { display: block; width: 216px; height: auto; }

        .availability {
            margin: 18px 0 0;
            color: rgba(248, 250, 252, .56);
            font-size: .92rem;
        }

        footer {
            min-height: 92px;
            padding: 24px 16px;
            color: rgba(248, 250, 252, .60);
            text-align: center;
            font-size: .9rem;
        }

        footer a { color: #7DD3FC; text-underline-offset: 3px; }
        footer span { margin: 0 8px; opacity: .45; }

        @media (max-width: 520px) {
            main { width: min(100% - 20px, 720px); padding-top: 14px; }
            .card { border-radius: 28px; }
            .mascot-wrap { border-radius: 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .store-link { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <section class="card" aria-labelledby="page-title">
            <div class="brand">
                <img src="assets/storytime_logo.png" alt="">
                <span>Storytime AI</span>
            </div>

            <div class="mascot-wrap">
                <img src="assets/cozy_bookworm.webp" alt="The Cozy Bookworm reading a glowing book">
            </div>

            <h1 id="page-title">Bedtime adventures await</h1>
            <p class="tagline">
                Create interactive, family-friendly bedtime stories and turn them into magical audiobooks.
            </p>

            <div class="store-actions">
                <a
                    class="store-link"
                    id="google-play-link"
                    href="https://play.google.com/store/apps/details?id=com.yug.StoryTimeAI"
                    aria-label="Get Storytime AI on Google Play"
                >
                    <img src="assets/google-play-badge.png" alt="Get it on Google Play">
                </a>

                <!-- Add the official App Store badge here when the iOS listing is live. -->
            </div>
            <p class="availability">Available now on Android. iPhone and iPad support is coming later.</p>
        </section>
    </main>

    <footer>
        <a href="index.html#privacy-policy">Privacy Policy</a>
        <span aria-hidden="true">•</span>
        <a href="index.html#terms-and-conditions">Terms &amp; Conditions</a>
        <span aria-hidden="true">•</span>
        <a href="mailto:support@storytimeai.app">Support</a>
    </footer>

    <script>
        // Keep the chooser visible on every platform. When the iOS listing is live,
        // add its official badge above; optional automatic routing can be added then.
        const playLink = document.getElementById('google-play-link');
        if (/Android/i.test(navigator.userAgent)) {
            playLink.setAttribute('aria-current', 'true');
        }
    </script>
</body>
</html>
